[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "degree-null-research"
version = "0.2.0"
description = "Degree-preserving comparisons with separated fast and bounded native reference contracts"
readme = "README.md"
requires-python = ">=3.12,!=3.14.1"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "paper/LICENSE.md"]
authors = [{name = "DaniilKi contributors"}]
dependencies = []

[project.optional-dependencies]
fast = ["networkit==11.2.2", "psutil==7.2.2"]

[project.scripts]
degree-null = "degree_null.cli:main"
curveball-arithmetic-check = "curveball_budget.arithmetic_cli:main"
curveball-reference = "curveball_budget.sampling_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
